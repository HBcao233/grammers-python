name: Build Android (Termux) Wheels

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.readthedocs.yaml'
      - '.gitignore'
      - 'LICENSE'
      - 'Makefile'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.readthedocs.yaml'
      - '.gitignore'
      - 'LICENSE'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        platform:
          - target: aarch64-linux-android
            arch: arm64-v8a
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            arch: armeabi-v7a
            abi: armeabi-v7a
          - target: x86_64-linux-android
            arch: x86_64
            abi: x86_64
          - target: i686-linux-android
            arch: x86
            abi: x86
    steps:
      - uses: actions/checkout@v6

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true
          local-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          command: build
          args: --release --out dist --find-interpreter
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-android-${{ matrix.platform.arch }}
          path: dist
